<html lang="en">

<style>
:root{--rakuten:#bf0000;--ink:#171717;--muted:#697386;--soft:#f5f6f8;--line:#e5e7eb;--orange:#ff5f00;--green:#0f9d58;--shadow:0 24px 70px rgba(17,24,39,.18);--phoneW:min(360px,78vw,calc((100vh - 170px)*.5));--phoneH:min(720px,calc(100vh - 170px),156vw)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;background:linear-gradient(135deg,#fff,#f7f7f7 55%,#fff0ed);color:var(--ink)}button{font:inherit}.wrap{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr}.top{min-height:70px;display:flex;align-items:center;justify-content:center;padding:12px 24px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.logo{width:34px;height:34px;border-radius:9px;background:var(--rakuten);display:grid;place-items:center;color:#fff;font-weight:900}.brand span{color:var(--rakuten);font-weight:900}.stageBar{position:sticky;top:70px;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;justify-content:center}.stages{width:min(980px,100%);display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.stages button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:7px 5px;cursor:pointer;text-align:center;min-height:44px;transition:.16s ease}.stages button.active{border-color:var(--rakuten);background:#fff7f7;box-shadow:0 6px 16px rgba(191,0,0,.10)}.stages b{display:block;font-size:10px;line-height:1.12}.stages small{display:block;color:var(--muted);font-size:8.5px;margin-top:2px;line-height:1.05}.main{display:grid;place-items:center;width:100%;padding:18px 24px}.phone{width:var(--phoneW);height:var(--phoneH);background:#fff;border:10px solid #111;border-radius:42px;overflow:hidden;box-shadow:var(--shadow);position:relative}.status{height:25px;background:#111;color:white;font-size:10px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.screen{height:calc(100% - 25px);display:flex;flex-direction:column;animation:fade .22s ease}.head{background:linear-gradient(130deg,var(--rakuten),#e52d2d);color:#fff;padding:14px 16px 16px}.head (--muted);font-size:10px}.metric b{display:block;font-size:16px;margin-top:3px}.progress{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:9px 0}.progress i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--rakuten),var(--orange))}.prodGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.prod{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;cursor:pointer}.img{height:78px;display:grid;place-items:center;background:linear-gradient(135deg,#eef0f4,#fff);font-size:34px}.txt{padding:8px}.txt b{font-size:11.5px}.txt small{display:block;color:var(--muted);margin-top:3px;font-size:10px}.alert{display:flex;gap:9px;background:#111827;color:#fff;border-radius:16px;padding:11px;margin-bottom:10px}.alert p{color:#d1d5db}.mcchip{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:5px 8px;border-radius:999px;background:#fff;border:1px solid #ffd5c8;color:#8a2c00;font-size:9.5px;font-weight:900;letter-spacing:.03em}.mcmark{display:inline-flex}.mcmark i{width:11px;height:11px;border-radius:50%;background:#eb001b;display:block}.mcmark i+i{background:#ff5f00;margin-left:-4px;mix-blend-mode:multiply}@keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@media(max-width:900px){:root{--phoneW:min(340px,86vw);--phoneH:min(695px,calc(100vh - 175px),176vw)}.stages{grid-template-columns:repeat(3,1fr)}.main{padding:16px}.stageBar{top:70px}}@media(max-width:460px){:root{--phoneW:min(330px,92vw);--phoneH:min(680px,calc(100vh - 180px),188vw)}.stages{grid-template-columns:repeat(2,1fr)}.top{padding:12px}.stageBar{position:static}}
</style>

 ja:{mainTitle:'楽天デジタルリワードハブ',langBtn:'EN',nav:{home:'ホーム',shop:'検索',card:'カード',points:'ポイント',menu:'メニュー'},stageShort:['開始','連携','意図','選定','説明','購入','学習','進捗','再訪'],stages:['1. ステータス','2. 有効化','3. 閲覧','4. オファー','5. 商品','6. 決済','7. 完了','8. 進捗','9. 通知'],search:'楽天で検索',subIchiba:'楽天市場',subBank:'楽天銀行',subCard:'楽天カード',subHP:'ハッピープログラム',subNotification:'通知プレビュー',welcome:'おかえりなさい、花子さん',statusTitle:'本日のロイヤルティステータス',statusLine:'プレミアム · VIPまであと2アクション',points:'ポイント',freeTransfers:'無料振込',left:'残り2回',recommended:'おすすめ',homeValue:'新生活準備に使える特典',homeValueCopy:'最近のご利用傾向に基づき、決済時に使える控えめなMastercard特典を表示しています。',mcBenefit:'Mastercard特典',viewBenefit:'特典を見る',whyThis:'理由を見る',progress:'進捗',progressCopy:'対象取引や残高に応じて、毎月のステータスが決まります。',progressLine:'プレミアム → VIP',unlockBenefits:'特典を有効化',actionNeeded:'手続きが必要',linkTitle:'楽天会員アカウントを連携',linkCopy:'アカウントを連携すると、プログラム特典とパーソナライズされたおすすめを利用できます。',startLink:'連携を開始',whyLink:'なぜ連携するのか',whyLinkCopy:'対象サービス上で、ステータス、ポイント、特典情報を表示できるようになります。',electronics:'暮らしの家電',kettle:'電気ケトル',compactKettle:'コンパクトケトル',pointsEligible:'ポイント対象',tv:'40インチテレビ',recNext:'次のおすすめ',signal:'シグナル',homeSetup:'新生活準備中ですか？',homeSetupCopy:'家電を揃えるご家庭に人気の商品です。',offersForYou:'あなたへのオファー',exclusive:'あなた限定',completeSetup:'新生活準備を仕上げる',offerCopy:'対象の楽天市場ショップで、 eligible card を使うと40インチテレビが5%オフ。対象の場合、Mastercard特典も含まれます。',viewOffer:'オファーを見る',offerList:'あなたへのおすすめ',kura:'くら寿司',pointsBack:'10%ポイント還元',homeStore:'ホームストア',back5:'5%還元',whyOffer:'おすすめ理由',livingRoom:'リビング準備に合う商品です',livingRoomCopy:'最近、新生活関連の商品を購入しているためおすすめしています。',completeSetupAdd:'一緒にそろえる',hdmi:'HDMIケーブル',stand:'テレビ台',addBenefit:'特典付きで追加',checkout:'お支払い',order:'注文内容',offerApplied:'オファー適用',mcBenefitTag:'MASTERCARD特典',useEligible:'対象カードを使用',checkoutCopy:'このパーソナライズ特典を利用し、対象のMastercard特典でロイヤルティ進捗を見える化します。',mcApplied:'Mastercard特典を適用',payNow:'支払う',savedLater:'ケトルはあとで購入',savedLaterCopy:'新しいオファーや値下げがある場合、フォロー通知を表示できます。',purchaseComplete:'購入完了',unlocked:'暮らしの特典を利用しました',unlockedCopy:'本日のパーソナライズ特典と、対象のMastercard価値が有効になりました。',mcRecognised:'Mastercard価値を認識',pointsExpected:'獲得予定ポイント',offerSaved:'割引',next:'次のおすすめ',boxes:'収納ボックス',router:'Wi-Fiルーター',loyaltyProgress:'ロイヤルティ進捗',vipProgress:'プレミアム → VIP進捗',vipCopy:'次のステータスまであと2アクションです。',atm:'ATM無料回数',pointsUtility:'ポイント活用',pointsHarder:'ポイントをもっと便利に',pointsHarderCopy:'プログラム条件に基づき、対象の銀行支払い・サービスにポイントを利用できます。',seeWays:'使い方を見る',priceDrop:'値下げ通知',kettleOffer:'保存したケトルに新しいオファーがあります',pushCopy:'新生活準備を続け、対象カードでMastercard価値を確認できます。',mcReminder:'Mastercard特典リマインダー',returnCart:'カートへ戻る',dismiss:'閉じる',whyNotification:'通知理由',whyNotificationCopy:'商品がカートに残っており、関連するオファーが利用可能になりました。'}
};
const stages=['status','activate','browse','offer','pdp','checkout','confirm','recap','push'];
let current=0, lang='en';
const c=()=>copy[lang];
function toggleLang(){lang=lang==='en'?'ja':'en';document.documentElement.lang=lang;render(current);renderStages();}
function stageLabel(i){return `<b>${c().stages[i]}</b><small>${c().stageShort[i]}</small>`}
function renderStages(){document.querySelector('[data-i18n="mainTitle"]').textContent=c().mainTitle;document.getElementById('stages').innerHTML=stages.map((id,i)=>`<button data-i="${i}" class="${i===current?'active':''}">${stageLabel(i)}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>render(+b.dataset.i));}
function head(title,sub){return `<div class="status"><span>9:41</span><span>5G ▰</span></div><div class="screen"><div class="head"><div class="headTop"><small>${sub||c().subIchiba}</small><button class="langBtn" onclick="toggleLang()">${c().langBtn}</button></div><h1>${title}</h1><div class="search"><span>${c().search}</span><b>⌕</b></div></div><div class="body">`}
function bottom(on='home'){return `</div><div class="bottom"><div class="${on==='home'?'on':''}" onclick="go('status')"><b>⌂</b>${c().nav.home}</div><div class="${on==='shop'?'on':''}" onclick="go('browse')"><b>▦</b>${c().nav.shop}</div><div class="${on==='card'?'on':''}" onclick="go('offer')"><b>◇</b>${c().nav.card}</div><div class="${on==='points'?'on':''}" onclick="go('recap')"><b>◎</b>${c().nav.points}</div><div onclick="go('push')"><b>☰</b>${c().nav.menu}</div></div></div>`}
function mcchip(text){return `<div class="mcchip"><span class="mcmark"><i></i><i></i></span>${text}</div>`}
function screen(type){
if(type==='status')return head(c().welcome)+`<div class="alert"><b>✦</b><p><b>${c().statusTitle}</b><br>${c().statusLine}</p></div><div class="metrics"><div class="metric"><small>${c().points}</small><b>10,000</b></div><div class="metric"><small>${c().freeTransfers}</small><b>${c().left}</b></div></div><div class="card offer"><span class="tag">${c().recommended}</span><h3>${c().homeValue}</h3><p>${c().homeValueCopy}</p>${mcchip(c().mcBenefit)}<div class="row" style="margin-top:10px"><button class="btn" onclick="go('offer')">${c().viewBenefit}</button><button class="btn alt" onclick="go('browse')">${c().whyThis}</button></div></div><div class="card"><h3>${c().progress}</h3><p>${c().progressCopy}</p><div class="progress" style="--w:76%"><i></i></div><p>${c().progressLine}</p></div>`+bottom('home');
if(type==='activate')return head(c().unlockBenefits,c().subBank)+`<div class="card offer"><span class="tag">${c().actionNeeded}</span><h3>${c().linkTitle}</h3><p>${c().linkCopy}</p><button class="btn" style="margin-top:10px" onclick="go('status')">${c().startLink}</button></div><div class="card"><h3>${c().whyLink}</h3><p>${c().whyLinkCopy}</p></div>`+bottom('card');
if(type==='browse')return head(c().electronics)+`<div class="card"><div class="search" style="margin:0;background:#f9fafb"><span>${c().kettle}</span><b>⌕</b></div></div><div class="prodGrid"><div class="prod"><div class="img">♨️</div><div class="txt"><b>${c().compactKettle}</b><small>${c().pointsEligible}</small></div></div><div class="prod" onclick="go('offer')"><div class="img">📺</div><div class="txt"><b>${c().tv}</b><small>${c().recNext}</small></div></div></div><div class="card offer"><span class="tag">${c().signal}</span><h3>${c().homeSetup}</h3><p>${c().homeSetupCopy}</p></div>`+bottom('shop');
if(type==='offer')return head(c().offersForYou)+`<div class="card offer"><span class="tag">${c().exclusive}</span><h3>${c().completeSetup}</h3><p>${c().offerCopy}</p>${mcchip(c().mcBenefit)}<div class="row" style="margin-top:10px"><b style="color:var(--rakuten)">5% off</b><button class="btn" onclick="go('pdp')">${c().viewOffer}</button></div></div><div class="card"><h3>${c().offerList}</h3><div class="prodGrid"><div class="prod"><div class="img">🍣</div><div class="txt"><b>${c().kura}</b><small>${c().pointsBack}</small></div></div><div class="prod"><div class="img">🏠</div><div class="txt"><b>${c().homeStore}</b><small>${c().back5}</small></div></div></div></div>`+bottom('card');
if(type==='pdp')return head(c().tv)+`<div class="prod" onclick="go('checkout')"><div class="img" style="height:138px">📺</div><div class="txt"><b>Smart ${c().tv}</b><small>${lang==='en'?'Eligible household offer':'対象の住まい関連オファー'}</small></div></div><div class="card offer"><span class="tag">${c().whyOffer}</span><h3>${c().livingRoom}</h3><p>${c().livingRoomCopy}</p></div><div class="card"><h3>${c().completeSetupAdd}</h3><div class="prodGrid"><div class="prod"><div class="img">🔌</div><div class="txt"><b>${c().hdmi}</b></div></div><div class="prod"><div class="img">🧰</div><div class="txt"><b>${c().stand}</b></div></div></div></div><button class="btn" style="width:100%" onclick="go('checkout')">${c().addBenefit}</button>`+bottom('shop');
if(type==='checkout')return head(c().checkout,c().subCard)+`<div class="card"><h3>${c().order}</h3><div class="row"><span>${c().tv}</span><b>¥48,800</b></div><div class="row"><span>${c().offerApplied}</span><b style="color:var(--green)">-5%</b></div></div><div class="card offer"><span class="tag">${c().mcBenefitTag}</span><h3>${c().useEligible}</h3><p>${c().checkoutCopy}</p>${mcchip(c().mcApplied)}<button class="btn" style="margin-top:10px" onclick="go('confirm')">${c().payNow}</button></div><div class="card"><h3>${c().savedLater}</h3><p>${c().savedLaterCopy}</p></div>`+bottom('card');
if(type==='confirm')return head(c().purchaseComplete)+`<div class="alert"><b>✓</b><p><b>${c().unlocked}</b><br>${c().unlockedCopy}</p></div>${mcchip(c().mcRecognised)}<div class="metrics"><div class="metric"><small>${c().pointsExpected}</small><b>+1,200</b></div><div class="metric"><small>${c().offerSaved}</small><b>5%</b></div></div><div class="card"><h3>${c().next}</h3><div class="prodGrid"><div class="prod"><div class="img">📦</div><div class="txt"><b>${c().boxes}</b></div></div><div class="prod"><div class="img">📶</div><div class="txt"><b>${c().router}</b></div></div></div></div>`+bottom('home');
if(type==='recap')return head(c().loyaltyProgress,c().subHP)+`<div class="card"><h3>${c().vipProgress}</h3><p>${c().vipCopy}</p><div class="progress" style="--w:76%"><i></i></div></div><div class="metrics"><div class="metric"><small>${c().atm}</small><b>${c().left}</b></div><div class="metric"><small>${c().freeTransfers}</small><b>${c().left}</b></div></div><div class="card offer"><span class="tag">${c().pointsUtility}</span><h3>${c().pointsHarder}</h3><p>${c().pointsHarderCopy}</p><button class="btn" style="margin-top:10px" onclick="go('status')">${c().seeWays}</button></div>`+bottom('points');
if(type==='push')return head(c().subNotification,c().subNotification)+`<div class="card offer"><span class="tag">${c().priceDrop}</span><h3>${c().kettleOffer}</h3><p>${c().pushCopy}</p>${mcchip(c().mcReminder)}<div class="row" style="margin-top:10px"><button class="btn" onclick="go('checkout')">${c().returnCart}</button><button class="btn alt" onclick="go('recap')">${c().dismiss}</button></div></div><div class="card"><h3>${c().whyNotification}</h3><p>${c().whyNotificationCopy}</p></div>`+bottom('home');
}
function go(id){const i=stages.indexOf(id);if(i>=0)render(i)}
function render(i){current=Math.max(0,Math.min(stages.length-1,i));document.querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('active',+b.dataset.i===current));document.getElementById('phone').innerHTML=screen(stages[current]);renderStages();}
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown'].includes(e.key)){e.preventDefault();render(current+1)}if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();render(current-1)}if(e.key==='Home'){e.preventDefault();render(0)}if(e.key==='End'){e.preventDefault();render(stages.length-1)}});
renderStages();render(0);
</script>
</body>
